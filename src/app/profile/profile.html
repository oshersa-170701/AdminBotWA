<!-- Overlay del modal con cierre al hacer clic fuera -->
<div class="profile-modal-overlay" (click)="onOverlayClick($event)" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); display: flex; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(6px);">
  
  <div class="profile-modal-container" style="background: #ffffff; padding: 36px 30px; color: #0f172a; width: 100%; max-width: 420px; border-radius: 26px; border: 1px solid rgba(59, 130, 246, 0.15); box-shadow: 0 25px 50px -12px rgba(30, 64, 175, 0.25); box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;">

    <!-- Línea superior de acento corporativo -->
    <div style="position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #1d4ed8 0%, #3b82f6 50%, #93c5fd 100%);"></div>

    <!-- Contenido superior -->
    <div>
      <div class="modal-header-custom" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 style="margin: 0; font-size: 1.4rem; font-weight: 800; color: #1e3a8a; letter-spacing: -0.02em;">Mi Perfil</h2>
        <button type="button" class="close-btn" (click)="closeModal()" style="background: #f1f5f9; border: none; color: #64748b; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Avatar e Información del Usuario -->
      <div class="profile-info-container" style="text-align: center; margin-bottom: 28px;">
        <div class="profile-avatar-glow" style="width: 76px; height: 76px; background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); color: #1e40af; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px auto; font-size: 1.7rem; font-weight: 800; border: 2px solid #bfdbfe; box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.2);">
          {{ user?.name ? user.name.charAt(0).toUpperCase() : 'U' }}
        </div>
        <h3 style="margin: 0 0 4px 0; font-size: 1.25rem; font-weight: 700; color: #0f172a;">{{ user?.name || 'Usuario' }}</h3>
        <p style="margin: 0; color: #64748b; font-size: 0.88rem; font-weight: 500;">Administrador de Empresa</p>
      </div>

      <!-- Tarjeta Detalle: Correo Electrónico -->
      <div class="profile-details-card" style="background: #f8fafc; border: 1.5px solid #e2e8f0; padding: 14px 16px; border-radius: 14px; margin-bottom: 14px;">
        <div class="detail-row" style="display: flex; align-items: center; gap: 14px;">
          <div class="detail-icon-box" style="width: 42px; height: 42px; background: #eff6ff; color: #2563eb; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid #dbeafe;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          </div>
          <div class="detail-text">
            <span style="display: block; font-size: 0.72rem; color: #64748b; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">Correo Electrónico</span>
            <h4 style="margin: 2px 0 0 0; font-size: 0.93rem; color: #1e293b; font-weight: 600; word-break: break-all;">{{ user?.email || 'No disponible' }}</h4>
          </div>
        </div>
      </div>

      <!-- Tarjeta Detalle: Número de Teléfono -->
      <div class="profile-details-card" style="background: #f8fafc; border: 1.5px solid #e2e8f0; padding: 14px 16px; border-radius: 14px; margin-bottom: 14px;">
        <div class="detail-row" style="display: flex; align-items: center; gap: 14px;">
          <div class="detail-icon-box" style="width: 42px; height: 42px; background: #f0fdf4; color: #16a34a; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid #dcfce7;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
            </svg>
          </div>
          <div class="detail-text">
            <span style="display: block; font-size: 0.72rem; color: #64748b; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">Número de Teléfono</span>
            <h4 style="margin: 2px 0 0 0; font-size: 0.93rem; color: #1e293b; font-weight: 600;">{{ user?.whatsapp_phone || 'No registrado' }}</h4>
          </div>
        </div>
      </div>
    </div>

    <!-- Botón de Cerrar Sesión -->
    <button type="button" (click)="logout()" class="modal-logout-btn" style="width: 100%; background: #ef4444; color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); transition: background 0.2s;">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      Cerrar Sesión
    </button>

  </div>
</div>
