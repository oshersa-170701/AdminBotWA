<div class="login-container">
  <div class="login-card-box">
    
    <!-- Encabezado corporativo -->
    <div class="login-header">
      <div class="logo-circle">
        <img src="LOGO.png" alt="Logo" class="logo-image">
      </div>
      <h2>Admin Bot WA</h2>
      <p>Panel de Control Automatizado para WhatsApp</p>
    </div>

    <!-- Formulario controlado con Angular -->
    <form (ngSubmit)="onLogin()" class="login-form">
      
      <!-- Campo Correo -->
      <div class="input-group">
        <label>Correo electrónico</label>
        <div class="input-field-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round5" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          <input type="email" [(ngModel)]="email" name="email" placeholder="admin@ejemplo.com" required>
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="input-group">
        <label>Contraseña</label>
        <div class="input-field-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="••••••••" required>
          <button type="button" class="eye-btn" (click)="togglePassword()">
            @if (showPassword) {
              <!-- Icono Ocultar / Ojo tachado -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            } @else {
              <!-- Icono Mostrar / Ojo abierto -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Botón de Envío -->
      <button type="submit" [disabled]="isLoading" class="submit-btn">
        @if (!isLoading) {
          <span>Entrar al Sistema &rarr;</span>
        } @else {
          <span class="loading-spinner">Verificando credenciales...</span>
        }
      </button>

    </form>
    
    <!-- Pie de página -->
    <div class="login-footer">
      <p>Sistema de Gestión &copy; 2026</p>
    </div>

  </div>
</div>
