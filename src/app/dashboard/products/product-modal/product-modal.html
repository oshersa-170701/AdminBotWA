<!-- Modal de Registro / Edición de Producto -->
<div class="modal-background" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; box-sizing: border-box; backdrop-filter: blur(6px);">
  
  <div class="modal-wrapper" style="background: #ffffff; border: 1px solid rgba(59, 130, 246, 0.15); border-radius: 26px; max-width: 550px; width: 100%; color: #0f172a; display: flex; flex-direction: column; max-height: 90vh; overflow: hidden; position: relative; box-shadow: 0 25px 50px -12px rgba(30, 64, 175, 0.25);">
    
    <!-- Línea superior de acento corporativo -->
    <div style="position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #1d4ed8 0%, #3b82f6 50%, #93c5fd 100%);"></div>

    <!-- Barra superior del modal -->
    <header class="modal-toolbar" style="background: #f8fafc; padding: 20px 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid #e2e8f0;">
      <h3 style="margin: 0; font-weight: 800; color: #1e3a8a; font-size: 1.25rem; letter-spacing: -0.02em;">
        {{ isEditing ? 'Editar Producto' : 'Nuevo Producto' }}
      </h3>
      <button type="button" (click)="onClose()" class="close-btn" style="background: #ffffff; border: 1.5px solid #cbd5e1; color: #64748b; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </header>

    <!-- Contenido desplazable -->
    <div style="padding: 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px;">
      
      <!-- Nombre del producto -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="color: #1e3a8a; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.01em;">Nombre del producto</label>
        <input type="text" name="productName" [(ngModel)]="formData.name" placeholder="Ej. Cemento Cruz Azul 50kg"
               style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 13px 16px; color: #0f172a; outline: none; font-size: 0.95rem; font-weight: 500; transition: all 0.2s;">
      </div>

      <!-- Marca -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="color: #1e3a8a; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.01em;">Marca</label>
        <input type="text" name="productBrand" [(ngModel)]="formData.brand" placeholder="Ej. Cruz Azul"
               style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 13px 16px; color: #0f172a; outline: none; font-size: 0.95rem; font-weight: 500; transition: all 0.2s;">
      </div>

      <!-- Fila: Precio y Stock -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="color: #1e3a8a; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.01em;">Precio ($)</label>
          <input type="number" name="productPrice" [(ngModel)]="formData.price" placeholder="0.00"
                 style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 13px 16px; color: #0f172a; outline: none; font-size: 0.95rem; font-weight: 500;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="color: #1e3a8a; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.01em;">Stock</label>
          <input type="number" name="productStock" [(ngModel)]="formData.stock" placeholder="0"
                 style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 13px 16px; color: #0f172a; outline: none; font-size: 0.95rem; font-weight: 500;">
        </div>
      </div>

      <!-- Fila: Unidad de medida y SKU -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="color: #1e3a8a; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.01em;">Unidad de medida</label>
          <input type="text" name="productUnit" [(ngModel)]="formData.unit" placeholder="pza, kg, lt, etc."
                 style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 13px 16px; color: #0f172a; outline: none; font-size: 0.95rem; font-weight: 500;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="color: #1e3a8a; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.01em;">SKU / Código</label>
          <input type="text" name="productSku" [(ngModel)]="formData.sku" placeholder="Código único"
                 style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 13px 16px; color: #0f172a; outline: none; font-size: 0.95rem; font-weight: 500;">
        </div>
      </div>

      <!-- Campo de URL de Imagen -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="color: #1e3a8a; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.01em;">URL de la Imagen</label>
        <input type="text" name="productImageUrl" [(ngModel)]="formData.image_url" placeholder="https://ejemplo.com/producto.jpg"
               style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 13px 16px; color: #0f172a; outline: none; font-size: 0.95rem; font-weight: 500;">
      </div>

      <!-- Vista previa de la imagen (Control de flujo moderno con @if) -->
      @if (formData.image_url) {
        <div class="image-preview-box" style="background: #f8fafc; padding: 14px 18px; border-radius: 14px; border: 1.5px solid #cbd5e1; display: flex; align-items: center; gap: 14px;">
          <p style="margin: 0; color: #64748b; font-size: 0.85rem; font-weight: 600;">Vista previa:</p>
          <img [src]="formData.image_url" alt="Preview" onerror="this.src='https://via.placeholder.com/100?text=Error+URL'"
               style="width: 48px; height: 48px; object-fit: cover; border-radius: 10px; border: 1px solid #cbd5e1;">
        </div>
      }

      <!-- Descripción -->
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="color: #1e3a8a; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.01em;">Descripción</label>
        <textarea name="productDescription" [(ngModel)]="formData.description" placeholder="Detalles o características del producto..." rows="3"
                  style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 13px 16px; color: #0f172a; outline: none; font-size: 0.95rem; font-weight: 500; resize: vertical;"></textarea>
      </div>

      <!-- Botón de Guardar -->
      <button type="button" (click)="onSave()" class="primary-btn"
              style="width: 100%; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border: none; padding: 15px; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 1rem; margin-top: 8px; box-shadow: 0 10px 22px -4px rgba(37, 99, 235, 0.45); transition: background 0.2s;">
        {{ isEditing ? 'Guardar Cambios' : 'Registrar Producto' }}
      </button>

    </div>

  </div>
</div>
